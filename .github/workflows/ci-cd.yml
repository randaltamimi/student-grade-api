
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      # 1) Get the source code from the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

 
      # 2) Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

 
      # 3) Compile and run JUnit tests
      - name: Build and test with Maven
        run: mvn --batch-mode clean verify


 
      # 4) Run SonarCloud analysis
      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar


 
      # 5) Log in to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


 
      # 6) Build and push Docker image
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-api:${{ github.sha }}

